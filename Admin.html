
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kisan Seva Tools - Admin</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f2f5f3;
      color: #222;
    }
    header {
      background: #176b3a;
      color: white;
      padding: 18px;
      text-align: center;
    }
    main {
      max-width: 650px;
      margin: 28px auto;
      padding: 20px;
    }
    .card {
      background: white;
      padding: 22px;
      border-radius: 12px;
      box-shadow: 0 2px 10px #0001;
      margin-bottom: 18px;
    }
    input, button {
      width: 100%;
      padding: 12px;
      margin-top: 12px;
      border-radius: 7px;
      font-size: 16px;
    }
    input { border: 1px solid #bbb; }
    button {
      border: 0;
      background: #176b3a;
      color: white;
      font-weight: bold;
      cursor: pointer;
    }
    .secondary { background: #444; }
    .hidden { display: none; }
    #message { overflow-wrap: anywhere; }
  </style>
</head>
<body>
  <header>
    <h2>Kisan Seva Tools</h2>
    <div>Admin Dashboard</div>
  </header>

  <main>
    <section class="card" id="loginBox">
      <h3>Admin Login</h3>
      <p>Apne registered Admin email se login karein.</p>
      <form id="loginForm">
        <input id="email" type="email" placeholder="Admin Email" required>
        <input id="password" type="password" placeholder="Password" required>
        <button type="submit">Login</button>
      </form>
      <p id="message" role="status"></p>
    </section>

    <section class="card hidden" id="dashboard">
      <h3>Welcome, Admin!</h3>
      <p>Login successful.</p>
      <p>Firebase security verification abhi configure karni baaki hai.</p>
      <p>Farmer records abhi Google Sheet mein hain; yahan automatic nahi dikhenge.</p>
      <button class="secondary" id="logoutBtn">Logout</button>
    </section>
  </main>

  <script type="module">
    import { initializeApp } from
      "https://www.gstatic.com/firebasejs/12.4.0/firebase-app.js";
    import {
      getAuth, signInWithEmailAndPassword,
      onAuthStateChanged, signOut
    } from
      "https://www.gstatic.com/firebasejs/12.4.0/firebase-auth.js";
    import {
      getFirestore, doc, getDoc
    } from
      "https://www.gstatic.com/firebasejs/12.4.0/firebase-firestore.js";

    // Firebase Console ke Web App config se values bharein.
    const firebaseConfig = {
      apiKey: "AIzaSyBTb8imcHpQdP90ntoawVJGXN72Tbmmi-s",
      authDomain: "kisan-seva-tools.firebaseapp.com",
      projectId: "kisan-seva-tools",
      appId: "1:900938868284:web:5a5b278506955fc0f48539",
    }

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);
    const loginBox = document.getElementById("loginBox");
    const dashboard = document.getElementById("dashboard");
    const message = document.getElementById("message");

    async function checkAdmin(user) {
      const adminDoc = await getDoc(doc(db, "admins", user.uid));
      return adminDoc.exists() && adminDoc.data().role === "admin";
    }

    onAuthStateChanged(auth, async (user) => {
      loginBox.classList.remove("hidden");
      dashboard.classList.add("hidden");

      if (!user) {
        message.textContent = "";
        return;
      }

      try {
        if (await checkAdmin(user)) {
          loginBox.classList.add("hidden");
          dashboard.classList.remove("hidden");
        } else {
          message.textContent = "Is account ko Admin permission nahi hai.";
          await signOut(auth);
        }
      } catch (error) {
        message.textContent = "Verification failed. Firebase config aur Rules check karein.";
        await signOut(auth);
      }
    });

    document.getElementById("loginForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      message.textContent = "Login ho raha hai...";
      try {
        await signInWithEmailAndPassword(
          auth,
          document.getElementById("email").value.trim(),
          document.getElementById("password").value
        );
      } catch (error) {
        message.textContent = "Login nahi hua. Email, password aur Firebase config check karein.";
      }
    });

    document.getElementById("logoutBtn").addEventListener("click", async () => {
      await signOut(auth);
    });
  </script>
</body>
</html>
