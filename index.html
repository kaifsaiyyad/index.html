<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Kisan Seva Tools - Farmer Card</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#eef7ee;
  color:#222;
}

header{
  background:#176b35;
  color:white;
  text-align:center;
  padding:18px 10px;
}

header h1{
  margin:0;
  font-size:25px;
}

header p{
  margin:6px 0 0;
  font-size:14px;
}

.container{
  max-width:700px;
  margin:20px auto;
  padding:15px;
}

.form-box{
  background:white;
  padding:20px;
  border-radius:12px;
  box-shadow:0 3px 12px rgba(0,0,0,.12);
}

.form-box h2{
  margin-top:0;
  color:#176b35;
}

label{
  display:block;
  font-weight:bold;
  margin-top:13px;
  margin-bottom:5px;
}

input,select{
  width:100%;
  padding:11px;
  border:1px solid #bbb;
  border-radius:7px;
  font-size:15px;
}

button{
  width:100%;
  margin-top:12px;
  padding:13px;
  border:0;
  border-radius:8px;
  background:#176b35;
  color:white;
  font-size:16px;
  font-weight:bold;
}

.pdf-btn{
  background:#1257a6;
}

.error{
  display:none;
  background:#ffe7e7;
  color:#a00000;
  padding:10px;
  margin-top:12px;
  border-radius:7px;
}

.success{
  display:none;
  background:#e5f8e8;
  color:#176b35;
  padding:10px;
  margin-top:12px;
  border-radius:7px;
}

/* PDF AREA */

#pdfArea{
  background:white;
  padding:12px;
  width:100%;
}

/* CARD */

.card{
  width:100%;
  max-width:440px;
  margin:20px auto;
  aspect-ratio:85.6/53.98;
  background:white;
  border:2px solid #176b35;
  border-radius:12px;
  overflow:hidden;
  position:relative;
  box-shadow:0 4px 15px rgba(0,0,0,.18);
}

.card-front{
  padding:14px;
}

.card-header{
  text-align:center;
  border-bottom:1px solid #ddd;
  padding-bottom:7px;
}

.card-header h3{
  margin:0;
  color:#176b35;
  font-size:18px;
}

.card-header small{
  color:#666;
  font-size:9px;
}

.front-body{
  display:flex;
  gap:12px;
  margin-top:12px;
}

.photo-box{
  width:82px;
  height:101px;
  border:1px solid #aaa;
  border-radius:5px;
  overflow:hidden;
  flex-shrink:0;
  background:#f5f5f5;
}

.photo-box img{
  width:100%;
  height:100%;
  object-fit:cover;
}

.details{
  flex:1;
  font-size:11px;
  line-height:1.55;
}

.details b{
  color:#176b35;
}

.farmer-id{
  margin-top:9px;
  padding:7px;
  border:1px solid #176b35;
  border-radius:6px;
  text-align:center;
  font-weight:bold;
  color:#176b35;
  font-size:13px;
}

.personal{
  position:absolute;
  bottom:7px;
  left:12px;
  right:12px;
  text-align:center;
  font-size:7px;
  color:#777;
}

/* BACK */

.card-back{
  padding:14px;
}

.back-title{
  text-align:center;
  color:#176b35;
  font-size:17px;
  font-weight:bold;
  border-bottom:1px solid #ddd;
  padding-bottom:7px;
}

.back-content{
  width:calc(100% - 125px);
}

.address-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px;
  margin-top:12px;
}

.info-box{
  border:1px solid #ddd;
  border-radius:6px;
  padding:7px;
  font-size:10px;
}

.info-box b{
  display:block;
  color:#176b35;
  font-size:9px;
  margin-bottom:3px;
}

.land-box{
  margin-top:10px;
  border:1px solid #ddd;
  border-radius:6px;
  padding:8px;
}

.land-title{
  font-weight:bold;
  color:#176b35;
  font-size:10px;
  margin-bottom:6px;
}

.land-row{
  display:flex;
  justify-content:space-between;
  font-size:10px;
  border-top:1px solid #eee;
  padding:5px 0;
}

/* QR */

.qr-section{

  right:14px;
  bottom:12px;
