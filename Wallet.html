
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Kisan Seva Tools - Wallet</title>
<style>
body{font-family:Arial;background:#f1f6f2;margin:0;color:#183b28}
header{background:#176b3a;color:white;padding:20px;text-align:center}
main{max-width:600px;margin:20px auto;padding:15px}
.card{background:white;padding:18px;border-radius:12px;margin:15px 0}
button,input{width:100%;padding:12px;margin:7px 0;box-sizing:border-box}
button{background:#176b3a;color:white;border:0;border-radius:7px;font-weight:bold}
button:disabled{opacity:.5}
#msg{white-space:pre-wrap;overflow-wrap:anywhere}
</style>
</head>
<body>
<header><h2>🌾 Kisan Seva Tools Wallet</h2></header>
<main>
<div class="card">
<h3>Wallet Balance</h3>
<h2 id="balance">₹—</h2>
<p id="user">Checking login...</p>
<button id="login" hidden>Login</button>
</div>

<div class="card">
<h3>Add Wallet Balance</h3>
<label>Amount (₹)</label>
<input id="amount" type="number" min="1" max="5000" step="1" value="10">
<button id="pay">Pay with Razorpay</button>
<p id="msg">Connecting to Firebase...</p>
</div>

<div class="card">
<h3>Payment Requests</h3>
<div id="requests">Loading...</div>
</div>
<button onclick="location.href='Home.html'">← Home</button>
</main>

<script src="https://checkout.razorpay.com/v1/checkout.js"></script>
<script type="module">
import {initializeApp}
from "https://www.gstatic.com/firebasejs/12.4.0/firebase-app.js";
import {
 getAuth,onAuthStateChanged,signInWithEmailAndPassword
} from "https://www.gstatic.com/firebasejs/12.4.0/firebase-auth.js";
import {
 getFirestore,collection,query,where,orderBy,onSnapshot,doc,getDoc
} from "https://www.gstatic.com/firebasejs/12.4.0/firebase-firestore.js";
import {
 getFunctions,httpsCallable
} from "https://www.gstatic.com/firebasejs/12.4.0/firebase-functions.js";

const config={
 apiKey:"AIzaSyBTb8imcHpQdP90ntoawVJGXN72Tbmmi-s",
 authDomain:"kisan-seva-tools.firebaseapp.com",
 projectId:"kisan-seva-tools",
 appId:"1:900938868284:web:5a5b278506955fc0f48539"
};

const app=initializeApp(config);
const auth=getAuth(app);
const db=getFirestore(app);
const functions=getFunctions(app,"asia-south1");
const createOrder=httpsCallable(functions,"createPaymentOrder");
const verifyPayment=httpsCallable(functions,"verifyPayment");

const msg=document.getElementById("msg");
const payBtn=document.getElementById("pay");
let currentUser=null;
let stopRequests=null;
let stopWallet=null;

onAuthStateChanged(auth,async user=>{
 currentUser=user;
 document.getElementById("user").textContent=user
  ? "Logged in: "+(user.email||"Account")
  : "Please log in.";
 document.getElementById("login").hidden=!!user;
 payBtn.disabled=!user;

 if(stopRequests){stopRequests();stopRequests=null}
 if(stopWallet){stopWallet();stopWallet=null}

 if(!user){
  document.getElementById("balance").textContent="Login required";
  document.getElementById("requests").textContent="Login to view requests.";
  msg.textContent="Please log in to recharge.";
  return;
 }

 stopWallet=onSnapshot(doc(db,"wallets",user.uid),snap=>{
  const balance=snap.exists()?Number(snap.data().balance||0):0;
  document.getElementById("balance").textContent=
   Number.isFinite(balance)?"₹"+balance:"Balance unavailable";
 },()=>{
  document.getElementById("balance").textContent="Unavailable";
 });

 const q=query(collection(db,"paymentRequests"),
  where("uid","==",user.uid),orderBy("createdAt","desc"));

 stopRequests=onSnapshot(q,snap=>{
  const box=document.getElementById("requests");
  box.replaceChildren();
  if(snap.empty){box.textContent="No requests yet.";return}
  snap.forEach(item=>{
   const p=document.createElement("p");
   const d=item.data();
   p.textContent="₹"+d.amount+" — "+d.status;
   box.appendChild(p);
  });
 },()=>{
  document.getElementById("requests").textContent="Could not load requests.";
 });
});

document.getElementById("login").onclick=async()=>{
 const email=prompt("Account email:");
 if(!email)return;
 const password=prompt("Account password:");
 if(password===null)return;
 try{
  await signInWithEmailAndPassword(auth,email.trim(),password);
 }catch(e){msg.textContent="Login failed: "+e.message}
};

payBtn.onclick=async()=>{
 if(!currentUser){msg.textContent="Please log in first.";return}
 if(typeof Razorpay==="undefined"){
  msg.textContent="Payment checkout did not load. Check internet and retry.";
  return;
 }

 const amount=Number(document.getElementById("amount").value);
 if(!Number.isInteger(amount)||amount<1||amount>5000){
  msg.textContent="Enter a whole amount from ₹1 to ₹5000.";
  return;
 }

 payBtn.disabled=true;
 msg.textContent="Creating secure payment order...";

 try{
  const result=await createOrder({amount});
  const order=result.data;

  if(!order.orderId||!order.keyId||order.amount!==amount*100){
   throw new Error("Invalid order response.");
  }

  const checkout=new Razorpay({
   key:order.keyId,
   amount:order.amount,
   currency:order.currency,
   name:"Kisan Seva Tools",
   description:"Wallet recharge",
   order_id:order.orderId,
   prefill:{email:currentUser.email||""},
   theme:{color:"#176b3a"},
   handler:async response=>{
    msg.textContent="Verifying payment with server...";
    try{
     await verifyPayment({
      orderId:response.razorpay_order_id,
      paymentId:response.razorpay_payment_id,
      signature:response.razorpay_signature
     });
     msg.textContent="Payment verified. Wallet balance is updating.";
    }catch(e){
     msg.textContent="Payment submitted but verification is pending. Do not pay again immediately. Check your payment status.";
    }finally{
     payBtn.disabled=false;
    }
   },
   modal:{
    ondismiss:()=>{
     msg.textContent="Checkout closed. Check payment status before retrying.";
     payBtn.disabled=false;
    }
   }
  });

  checkout.on("payment.failed",response=>{
   msg.textContent="Payment failed. Check status before retrying.";
   payBtn.disabled=false;
  });

  checkout.open();
 }catch(e){
  console.error(e);
  msg.textContent="Payment setup failed: "+(e.message||"Please retry later.");
  payBtn.disabled=false;
 }
};
</script>
</body>
</html>
