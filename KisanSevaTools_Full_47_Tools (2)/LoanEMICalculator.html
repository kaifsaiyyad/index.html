<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Loan EMI Calculator | Kisan Seva Tools</title><style>
:root{--green:#176b3a;--bg:#f4f7f5;--ink:#17221b;--line:#dce5df}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px Arial,sans-serif}
header{background:var(--green);color:white;padding:18px 16px}header a{color:white;text-decoration:none}
main{max-width:900px;margin:22px auto;padding:0 14px}.panel{background:#fff;border:1px solid var(--line);border-radius:14px;padding:18px;margin:14px 0;box-shadow:0 2px 8px #173b2510}
h1{font-size:24px;margin:0 0 7px}h2{font-size:18px;margin-top:0}.muted{color:#5c6d62;font-size:14px}
label{display:block;font-weight:600;margin:12px 0 6px}input,select,textarea,button{font:inherit}input,select,textarea{width:100%;padding:11px;border:1px solid #bac9bf;border-radius:8px;background:white}
button,.btn{border:0;background:var(--green);color:#fff;border-radius:8px;padding:11px 15px;cursor:pointer;text-decoration:none;display:inline-block;margin:8px 6px 0 0}
button.secondary{background:#e5eee8;color:#153d25}button:disabled{opacity:.5}canvas,img.preview{max-width:100%;height:auto;border:1px dashed #b9c8bf;margin-top:12px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px}.note{background:#fff8df;padding:12px;border-radius:8px;border:1px solid #f0df9b}
@media print{header,.noprint,button{display:none!important}body{background:white}.panel{box-shadow:none;border:0}}
</style></head><body><header><a href="Home.html">← Kisan Seva Tools</a></header><main><section class="panel"><h1>Loan EMI Calculator</h1><div class="muted">Kisan Seva Tools • Local browser utility</div></section><section class="panel"><div class="muted">Category: Calculators • Icon: 🏦</div></section><section class="panel"><label>Loan amount (₹)</label><input id="p" type="number" value="100000"><label>Annual interest (%)</label><input id="r" type="number" value="10"><label>Tenure (months)</label><input id="n" type="number" value="12"><button onclick="calc()">Calculate EMI</button><h2 id="out"></h2><script>function calc(){let p=+document.querySelector("#p").value,r=+document.querySelector("#r").value/1200,n=+document.querySelector("#n").value;if(p<=0||n<=0)return;let e=r?p*r*Math.pow(1+r,n)/(Math.pow(1+r,n)-1):p/n;document.querySelector("#out").textContent="Monthly EMI: ₹"+e.toFixed(2)+" | Total: ₹"+(e*n).toFixed(2)+" | Interest: ₹"+(e*n-p).toFixed(2)}</script></section></main></body></html>
