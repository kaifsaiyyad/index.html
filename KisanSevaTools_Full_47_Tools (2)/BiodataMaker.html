</style></head><body><header><a href="Home.html">← Kisan Seva Tools</a></header><main><section class="panel"><h1>Biodata Maker</h1><div class="muted">Kisan Seva Tools • Local browser utility</div></section><section class="panel"><div class="muted">Category: Document Makers • Icon: 👤</div></section><section class="panel"><label>Full name</label><textarea rows="2" id="f0" placeholder="Full name"></textarea><label>Date of birth</label><textarea rows="2" id="f1" placeholder="Date of birth"></textarea><label>Address</label><textarea rows="2" id="f2" placeholder="Address"></textarea><label>Education</label><textarea rows="2" id="f3" placeholder="Education"></textarea><label>Occupation</label><textarea rows="2" id="f4" placeholder="Occupation"></textarea><label>Family details</label><textarea rows="2" id="f5" placeholder="Family details"></textarea><button onclick="previewDoc()">Preview document</button><button class="secondary" onclick="window.print()">Print / Save PDF</button><div id="out"></div><script>function previewDoc(){let fs=["Full name", "Date of birth", "Address", "Education", "Occupation", "Family details"],out=document.querySelector("#out");out.innerHTML="<hr><h2>Document preview</h2>"+fs.map((x,i)=>"<p><b>"+x+":</b> "+(document.querySelector("#f"+i).value||"—").replace(/</g,"&lt;")+"</p>").join("")}</script></section></main><script>
(function(){
 const host=document.querySelector('main'); if(!host)return;
 const first=host.querySelector('h1');
 const bar=document.createElement('div');bar.className='kist-utility noprint';bar.setAttribute('aria-label','Tool actions');
 const clear=document.createElement('button');clear.type='button';clear.className='secondary';clear.textContent='Clear form';clear.addEventListener('click',function(){if(!confirm('Clear all entered information?'))return;host.querySelectorAll('input,textarea,select').forEach(function(el){if(el.type==='checkbox'||el.type==='radio')el.checked=false;else if(el.type==='file')el.value='';else if(el.tagName==='SELECT')el.selectedIndex=0;else el.value='';});host.querySelectorAll('#out,[id*=preview i],[class*=preview i]').forEach(function(el){if(el.tagName==='CANVAS'){try{el.getContext('2d').clearRect(0,0,el.width,el.height)}catch(e){}}else if(el.id==='out')el.innerHTML='';});});
 const print=document.createElement('button');print.type='button';print.textContent='Print / Save PDF';print.addEventListener('click',function(){window.print()});
 bar.append(clear,print); if(first&&first.parentElement){first.parentElement.appendChild(bar)}else host.prepend(bar);
 const foot=document.createElement('div');foot.className='kist-foot';foot.textContent='Privacy note: this tool runs in your browser. Review the result before printing or sharing. Keep sensitive personal information secure.';host.appendChild(foot);
})();
